name: Build Electron App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-14
            platform: mac
          - os: macos-13
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build ${{ matrix.platform }} app
        run: npm run electron:build
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        if: matrix.platform == 'mac'
        run: ls -la frontend/dist-electron

      - name: List build output
        if: matrix.platform == 'win'
        run: dir frontend/dist-electron

      - name: Upload Windows installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: frontend/dist-electron/
          retention-days: 5

      - name: Upload Mac installer
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer-${{ matrix.os }}
          path: frontend/dist-electron/
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release

      - name: Download Mac installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer-macos-14
          path: release

      - name: Download Mac installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer-macos-13
          path: release

      - name: List release files
        run: ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
